<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Expense Classifier</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #aea4b8, #bfd2f3);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .login-card {
      background: #fff;
      padding: 2.5rem 2rem;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    .login-card h2 {
      margin-bottom: 1.5rem;
      color: #333;
    }

    .form-control {
      border-radius: 10px;
      padding: 0.75rem 1rem;
    }

    .btn-login {
      width: 100%;
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 10px;
      background: #2575fc;
      border: none;
      color: #fff;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-login:hover {
      background: #6a11cb;
    }

    .register-link {
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .register-link a {
      text-decoration: none;
      color: #2575fc;
      font-weight: bold;
    }

    .register-link a:hover {
      color: #6a11cb;
    }
  </style>
</head>
<body>

<div class="login-card">
  <h2>Login</h2>
  <input type="text" id="username" class="form-control mb-3" placeholder="Username">
  <input type="password" id="password" class="form-control mb-3" placeholder="Password">
  <button class="btn-login" onclick="window.location.href='dashboard.html'">
    Login
</button>
  <p class="register-link">
    Don't have an account? <a href="register.html">Register</a>
    
  </p>
</div>

<script src="auth.js"></script>
</body>
</html>
